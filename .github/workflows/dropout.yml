name: Dropout pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  run:
    name: Generate, train, and predict
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate the fake dataset
        run: python generate-dataset.py

      - name: Train the model
        run: python dropout-model.py

      - name: Score a sample student
        run: python predict-student.py 1001
